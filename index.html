<style>
  :root{

  :root[data-theme="light"]{
    --bg: #F7F4EC;
    --bg-raised: #EFEAD9;
    --bg-card: #FFFFFF;
    --hairline: #DED6C0;
    --text: #211D15;
    --text-dim: #4B4437;
    --text-faint: #756C5A;
    --gold: #9C7A2E;
    --gold-dim: #B99A55;
    --teal: #2E7A73;
    --focus: #8A6A1F;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{ background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; transition: background-color .2s ease, color .2s ease; }
  ::selection{ background: var(--gold); color: #14181f; }
  a { color: inherit; }
  button { font-family: var(--sans); cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .skip-link{
    position: absolute; left: 12px; top: -60px;
    background: var(--gold); color: #14181f; padding: 10px 16px;

  .cluster-head:focus-visible, .cat-item:focus-visible, .card:focus-visible{

  .shell{ display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }

  .masthead{ grid-column: 1 / -1; border-bottom: 1px solid var(--hairline); padding: 28px 32px; }
  .masthead-inner{

  .masthead p{ margin: 0; color: var(--text-dim); font-size: 14.5px; max-width: 58ch; line-height: 1.55; }
  .masthead-left{ flex: 1 1 380px; min-width: 0; }
  .brand-signature{
    display:flex; align-items:center; justify-content:center; gap: 10px;
    background: #10131A; color: #E8E6DE; padding: 16px 20px;

  .auth-gate{

    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; padding: 24px; text-align: center;
  }
  .auth-gate-inner{ display:flex; flex-direction:column; align-items:center; gap: 12px; max-width: 420px; }
  .logo-mark-lg{ width: 68px; height: 68px; border-radius: 50%; margin-bottom: 4px; background: #F7F4EC; padding: 6px; box-sizing: border-box; }
  .auth-gate h1{ font-family: var(--serif); font-weight: 600; font-size: 30px; color: var(--text); margin: 0; }
  .auth-gate p{ color: var(--text-dim); font-size: 14px; margin: 0; line-height: 1.5; }
  .auth-gate-btn{
    background: var(--gold); color: #14181f; border: none; border-radius: var(--radius);
    padding: 13px 26px; font-size: 14px; font-weight: 600; font-family: var(--sans); margin-top: 6px;
  }
  .auth-gate-note{ color: var(--text-faint) !important; font-size: 12px !important; margin-top: 4px !important; }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--bg-card); border: 1px solid var(--hairline); color: var(--text);
    padding: 10px 18px; border-radius: var(--radius); font-family: var(--mono); font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 600;
    max-width: 90vw;
  }
  .toast.open{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error{ border-color: #B5473A; color: #E8A99C; }

  .pager{ display:flex; align-items:center; justify-content:center; gap: 16px; margin-top: 26px; }
  .pager-btn{
    background: var(--bg-card); border: 1px solid var(--hairline); color: var(--text);
    border-radius: var(--radius); width: 38px; height: 38px; font-size: 16px;
  }
  .pager-btn:hover:not(:disabled){ border-color: var(--gold-dim); color: var(--gold); }
  .pager-btn:disabled{ opacity: 0.35; cursor: default; }
  .pager-label{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); min-width: 100px; text-align:center; }
  .title-row{ display:flex; align-items:center; gap: 14px; margin-bottom: 8px; }
  .title-row h1{ margin: 0; }
  .logo-mark{ width: 44px; height: 44px; flex: none; border-radius: 50%; background: #F7F4EC; padding: 4px; box-sizing: border-box; }
  .masthead-right{
    display: flex; align-items: center; gap: 20px; flex: 0 0 auto;
    background: var(--bg-raised); border: 1px solid var(--hairline); border-radius: var(--radius);
    padding: 14px 20px;
  }
  .stat-group{ display:flex; align-items:center; gap: 20px; }
  .stat-divider{ width: 1px; height: 30px; background: var(--hairline); }

  .stat .n{ font-size: 26px; color: var(--gold); display:block; line-height:1; }
  .stat .l{ font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; }
  .import-toggle{ background: transparent; border: 1px solid var(--hairline); color: var(--text-dim); border-radius: var(--radius); padding: 9px 14px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--mono); }
  .import-toggle:hover{ border-color: var(--gold-dim); color: var(--gold); }

  .import-panel{ grid-column: 1 / -1; border-bottom: 1px solid var(--hairline); background: var(--bg-raised); padding: 20px 32px; display: none; }
  .import-panel.open{ display: block; }
  .import-panel h3{ font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin: 0 0 10px; }
  .import-panel textarea{ width: 100%; min-height: 110px; background: var(--bg); color: var(--text); border: 1px solid var(--hairline); border-radius: var(--radius); font-family: var(--mono); font-size: 12px; padding: 12px; resize: vertical; }
  .import-row{ display:flex; gap: 10px; margin-top: 10px; align-items:center; }
  .import-row button{ background: var(--gold); color: #14181f; border: none; border-radius: var(--radius); padding: 9px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .import-msg{ font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

  .sidebar{ border-right: 1px solid var(--hairline); padding: 22px 20px 40px; height: 100%; overflow-y: auto; }
  .search-box{ position: relative; margin-bottom: 20px; }
  .search-box input{ width: 100%; background: var(--bg-raised); border: 1px solid var(--hairline); color: var(--text); border-radius: var(--radius); padding: 10px 12px 10px 32px; font-size: 13px; font-family: var(--sans); }
  .search-box input::placeholder{ color: var(--text-faint); }
  .search-box svg{ position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--text-faint); }

  .active-filters{ display:flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip{ font-family: var(--mono); font-size: 11px; color: var(--bg); background: var(--gold); border-radius: 999px; padding: 3px 10px; display:flex; align-items:center; gap:6px; }
  .chip button{ background:none; border:none; color: var(--bg); font-size: 13px; line-height:1; padding:0; }
  .clear-all{ font-family: var(--mono); font-size: 11px; color: var(--text-faint); background: none; border: none; text-decoration: underline; padding: 0; }

  .chip-filter{ margin-bottom: 12px; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--bg-raised); overflow: hidden; }
  .chip-filter-head{ display:flex; align-items:center; justify-content:space-between; padding: 10px 12px; cursor: pointer; user-select: none; }
  .chip-filter-head:hover{ background: rgba(201,162,75,0.06); }
  .chip-filter-label{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); display:flex; align-items:center; gap:8px; }
  .chip-filter-count{ font-family: var(--mono); font-size: 10px; color: #14181f; background: var(--gold); border-radius: 999px; padding: 1px 7px; }
  .chip-filter-row{ display:flex; flex-wrap:wrap; gap: 6px; padding: 0 12px 12px; border-top: 1px solid var(--hairline); padding-top: 10px; }
  .filter-chip{
    font-family: var(--sans); font-size: 12px; color: var(--text-dim); background: var(--bg-card);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 6px 12px;
  }
  .filter-chip:hover{ border-color: var(--gold-dim); color: var(--text); }
  .filter-chip.active{ background: var(--gold); color: #14181f; border-color: var(--gold); font-weight: 600; }

  .recent-chip{
    display:flex; align-items:center; justify-content: space-between; width: 100%;
    background: var(--bg-raised); border: 1px solid var(--hairline); color: var(--text-dim);
    border-radius: var(--radius); padding: 9px 12px; font-size: 12.5px; font-family: var(--sans);
    margin-bottom: 14px;
  }
  .recent-chip:hover{ border-color: var(--gold-dim); color: var(--text); }
  .recent-chip.active{ border-color: var(--gold); color: var(--gold); background: rgba(201,162,75,0.08); }
  .recent-chip .recent-count{ font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  .view-tabs{ display:flex; gap: 4px; margin-bottom: 16px; background: var(--bg-raised); border-radius: var(--radius); padding: 3px; }
  .view-tab{
    flex:1; background: none; border: none; color: var(--text-faint); font-family: var(--mono);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 7px 4px; border-radius: 2px;
  }
  .view-tab.active{ background: var(--bg-card); color: var(--gold); }

  .new-badge{
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #14181f; background: var(--gold); border-radius: 999px; padding: 2px 7px;
  }

  .auth-box{ display:flex; align-items:center; gap: 8px; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: transparent; border: 1px solid var(--hairline); color: var(--text-dim);
  }
  .icon-btn:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .icon-btn svg{ width: 18px; height: 18px; }
  .auth-btn{
    display:flex; align-items:center; gap: 8px; background: transparent; border: 1px solid var(--hairline);
    color: var(--text-dim); border-radius: var(--radius); padding: 9px 14px; font-size: 12.5px; font-family: var(--sans);
  }
  .auth-btn:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .auth-btn img{ width: 16px; height: 16px; }
  .profile-menu{ position: relative; }
  .profile-btn{
    width: 40px; height: 40px; border-radius: 50%; padding: 0; overflow: hidden;
    border: 2px solid var(--gold-dim); background: var(--bg-raised); flex: none;
  }
  .profile-btn:hover{ border-color: var(--gold); }
  .profile-btn img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile-initial{
    width: 100%; height: 100%; display:flex; align-items:center; justify-content:center;
    font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--gold);
  }
  .profile-dropdown{
    position: absolute; top: calc(100% + 10px); right: 0; width: 260px; z-index: 60;
    background: var(--bg-card); border: 1px solid var(--hairline); border-radius: var(--radius);
    box-shadow: 0 12px 28px rgba(0,0,0,0.35); overflow: hidden;
  }
  .profile-dropdown-header{ display:flex; align-items:center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--hairline); }
  .profile-avatar-lg{ width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; background: var(--bg-raised); border: 2px solid var(--gold-dim); }
  .profile-avatar-lg img{ width:100%; height:100%; object-fit:cover; display:block; }
  .profile-avatar-lg .profile-initial{ font-size: 17px; }
  .profile-name{ font-family: var(--sans); font-weight: 600; font-size: 14px; color: var(--text); }
  .profile-email{ font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 2px; word-break: break-all; }
  .profile-dropdown-item{
    width: 100%; text-align: left; background: none; border: none; padding: 13px 16px;
    font-family: var(--sans); font-size: 13.5px; color: var(--text-dim);
  }
  .profile-dropdown-item:hover{ background: var(--bg-raised); color: var(--text); }

  .bookmark-btn{
    background: none; border: 1px solid var(--hairline); color: var(--text-faint); border-radius: var(--radius);
    width: 30px; height: 30px; display:flex; align-items:center; justify-content:center; font-size: 15px; flex: none;
  }
  .bookmark-btn:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .bookmark-btn.saved{ color: var(--gold); border-color: var(--gold-dim); }
  .card-top-row{ display:flex; align-items:flex-start; justify-content: space-between; gap: 8px; }

  .cluster{ margin-bottom: 6px; }
  .category-scroll{ padding-right: 2px; }

  .cluster{
    border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--bg-raised);
    margin-bottom: 10px; overflow: hidden;
  }
  .cluster-head{
    display:flex; align-items:center; justify-content: space-between; padding: 12px 14px;
    cursor: pointer; user-select: none;
  }
  .cluster-head:hover{ background: rgba(201,162,75,0.06); }
  .cluster-head:hover .cluster-title{ color: var(--text); }
  .cluster-title{ font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .cluster-caret{ color: var(--gold); font-size: 13px; transition: transform .15s ease; }
  .cluster.collapsed .cluster-caret{ transform: rotate(-90deg); }
  .cluster.collapsed .cat-list{ display:none; }

  .cat-list{
    list-style:none; margin:0; padding: 2px 8px 8px; border-top: 1px solid var(--hairline);
    max-height: 280px; overflow-y: auto;
  }
  .cat-list::-webkit-scrollbar{ width: 6px; }
  .cat-list::-webkit-scrollbar-thumb{ background: var(--hairline); border-radius: 3px; }
  .cat-item{ display:flex; align-items:center; gap: 9px; padding: 7px 8px 7px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text-dim); border-left: 2px solid transparent; }
  .cat-item:hover{ background: var(--bg-raised); color: var(--text); }
  .cat-item.active{ background: var(--bg-raised); color: var(--text); border-left-color: var(--cat-color, var(--gold)); }
  .cat-dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--cat-color, var(--gold)); flex: none; }
  .cat-name{ flex:1; line-height:1.25; }
  .cat-count{ font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  .main{ padding: 26px 32px 60px; min-width: 0; }
  .main-top{ display:flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .main-heading{ font-family: var(--serif); font-size: 20px; color: var(--text); }
  .main-count{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
  .empty-state{ border: 1px dashed var(--hairline); border-radius: var(--radius); padding: 50px 24px; text-align: center; color: var(--text-dim); }

  .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .card{ background: var(--bg-card); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color .15s ease, transform .15s ease; }
  .card:hover{ border-color: var(--gold-dim); transform: translateY(-1px); }
  .card-top{ display:flex; align-items:center; justify-content: space-between; gap: 10px; }
  .card-id{ font-family: var(--mono); font-size: 11px; color: var(--text-faint); letter-spacing: 0.06em; }
  .card-type{ font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--hairline); color: var(--text-dim); white-space: nowrap; }
  .card-cat{ font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cat-color); display:flex; align-items:center; gap:6px; }
  .card-cat .cat-dot{ width:6px; height:6px; }
  .card h3{ font-family: var(--serif); font-weight: 600; font-size: 16.5px; margin: 0; line-height: 1.3; color: var(--text); }
  .card p.body{ margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top: 2px; }
  .tag{ font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 8px; }
  .card-source{ margin-top: auto; padding-top: 10px; border-top: 1px solid var(--hairline); font-size: 11.5px; color: var(--text-faint); display: flex; flex-direction: column; gap: 2px; }
  .card-source .src-kind{ font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--teal); margin-bottom: 2px; }
  .card-source .podcast{ color: var(--text-dim); font-weight: 600; }
  .card-hint{ font-family: var(--mono); font-size: 10.5px; color: var(--gold-dim); }


  /* ---------- Modal ---------- */
  .modal-backdrop{ position: fixed; inset: 0; background: rgba(6,9,13,0.72); display: none; align-items: flex-start; justify-content: center; padding: 6vh 20px; overflow-y: auto; z-index: 100; }
  .modal-backdrop.open{ display: flex; }

function catColor(catId){
  for (let ci = 0; ci < CLUSTERS.length; ci++){
    const idx = CLUSTERS[ci].categories.findIndex(c => c.id === catId);
    if (idx === -1) continue;
    const count = CLUSTERS[ci].categories.length;
    if (ci === 0){
      const hue = 170 + Math.round(idx * (60/count));
      return `hsl(${hue}, 42%, 58%)`;
    } else {
      const hue = 25 + Math.round(idx * (60/count));
      return `hsl(${hue}, 55%, 60%)`;
    }
  }
  return 'hsl(0, 0%, 55%)';
}

{category:29,type:"Frameworks",title:"The one-click zoom-out",tags:["systems thinking","frameworks"],body:"Before diving into any assigned problem, step back exactly one level and ask what you're assuming is true about the broader space it sits in — then return to execution.",context:{"explanation":"This is a lightweight systems-thinking habit — rather than diving straight into execution, you pause for a single beat to check the broader assumption behind the problem you've been handed.","why":"Local, fast execution without any zoom-out is exactly how teams build the wrong thing quickly — a small pause catches misaligned assumptions before they get expensive to unwind.","when":"The moment you're handed a scoped task or feature request, before you start designing a solution — especially when the problem feels routine, since that's when it's easiest to skip entirely.","how":"Ask yourself: 'What am I assuming is true about the broader space this problem sits in?' Spend one or two minutes on it, then return to execution — don't let the questioning stage drag on and stall progress.","example":"Picture being handed a new discovery feature to build: instead of opening a design tool immediately, you spend two minutes asking what bigger consumer problem it serves — the way a Netflix PM might before sketching a single screen."},stages:["1to10","10to100","100plus"],levels:["apm","pm","spm"],source:undefined},
{category:29,type:"Mental Models",title:"Think like your manager",tags:["systems thinking","perspective-taking"],body:"Zoom out by asking how your manager — or the wider org across finance, content, and other functions — would view the problem you're solving, not just your own team's KPI.",context:{"explanation":"A perspective-shifting mental model: instead of only optimizing for your own team's KPI, imagine how your manager — or the wider org — would view the same problem.","why":"Your local view is naturally narrow; zooming out to your manager's vantage point surfaces cross-functional tradeoffs that are invisible from inside your own team.","when":"When you're deep in a team-level decision and sense there might be a bigger tradeoff you're not seeing — e.g. before finalizing a roadmap bet or a prioritization call.","how":"Pause and ask: 'If my manager were making this call, weighing my team against every other priority they own, what would they want here?' Use the answer to pressure-test your plan.","example":"Elizabeth Stone describes doing exactly this at Netflix — asking how her own manager, weighing finance, content, and every other team's priorities at once, would view the same decision."},stages:["10to100","100plus"],levels:["pm","spm","group"],source:undefined},
{category:17,type:"Actionable Advice",title:"Make your manager's job easier",tags:["career tactics","trust"],body:"A durable, low-cost career move: reduce your manager's coordination or decision load, not just complete your own deliverables. It compounds trust faster than visibility-seeking.",context:{"explanation":"A career tactic: actively look for the recurring things your manager has to chase, coordinate, or clean up — and take ownership of them before being asked.","why":"It compounds trust and visibility far faster than simply completing your own deliverables well, because it demonstrates judgment beyond your assigned scope.","when":"Continuously — especially in 1:1s, status updates, and any moment you notice your manager repeating the same ask.","how":"Notice the pattern (what does my manager keep having to ask for or clean up?), then proactively own that piece of work or information flow without waiting to be asked.","example":"Instead of waiting to be asked for a status update before a leadership review, you send it the night before, already answering the follow-up questions you know are coming."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm"],source:undefined},
{category:1,type:"Principles",title:"Storming before forming",tags:["change management","role clarity"],body:"Any transformative new technology triggers a 'storming' phase before a 'forming' phase where new norms stabilize. Current AI-driven role confusion is a normal transition stage, not a sign something is broken.",context:{"explanation":"A framing principle borrowed from group-development theory: any transformative new technology triggers a period of role confusion ('storming') before new norms stabilize ('forming').","why":"Without this frame, current AI-driven confusion over who does what can feel like a sign something is broken, when it's actually a normal, temporary transition stage.","when":"Reach for this when you or your team feel disoriented about role boundaries after a new tool, process, or technology rollout.","how":"Name the phase out loud with your team ('we're in the storming phase') to reduce anxiety, and focus energy on defining new norms rather than assigning blame.","example":"Netflix's own product and engineering teams went through exactly this after Gen AI let PMs and designers start prototyping code themselves — the confusion wasn't a sign anything was broken."},stages:["10to100","100plus"],levels:["pm","spm","group","director"],source:undefined},
{category:16,type:"Frameworks",title:"Get the benefit, contain the cost",tags:["AI governance","guardrails"],body:"To adopt AI without letting quality slip: clarity on source-of-truth data; review gates before high-risk changes ship; explicit trust criteria for AI output; and reinforced human accountability for outcomes.",context:{"explanation":"A four-part checklist for adopting AI responsibly: source-of-truth data clarity, review gates before high-risk changes ship, explicit trust criteria for AI output, and reinforced human accountability.","why":"Adopting AI without these guardrails risks fast, confident-looking output that nobody actually validates — the guardrails let you get AI's speed without losing quality or accountability.","when":"Use when standing up any new AI-assisted workflow on your team — as a pre-launch checklist, not something you retrofit after a quality problem appears.","how":"Before launch, explicitly answer: What's our source-of-truth data? What needs a review gate? When can we trust AI output vs. require human review? Who stays accountable?","example":"Before letting an AI agent draft customer-facing copy, a team decides which data source is authoritative, requires human sign-off before anything ships, and keeps the PM accountable if it's wrong."},stages:["10to100","100plus"],levels:["spm","group","director","vp"],source:undefined},
{category:8,type:"Principles",title:"Faster tools don't retire the design mindset",tags:["design thinking","craft"],body:"Even as prototyping accelerates, the most important priorities still deserve deliberate design work — making complexity invisible for the end user doesn't get automated away.",context:{"explanation":"Even though prototyping tools have gotten dramatically faster, the deliberate design thinking behind your most important priorities still deserves real time and attention.","why":"The differentiator was never speed — it's the design mindset of making complexity invisible for the end user, and that doesn't get automated away just because a prototype exists.","when":"When scoping your highest-priority initiatives — resist skipping deliberate design work just because a rough prototype already exists.","how":"For your top-priority work, deliberately timebox real design exploration even if a 'good enough' prototype already exists — don't let speed substitute for depth.","example":"Netflix still invests deliberately in design systems and templates for its most important member-experience work, even with prototyping faster than ever."},stages:["0to1","1to10","10to100"],levels:["pm","spm"],source:undefined},
{category:27,type:"Principles",title:"Craft mastery stays scarce",tags:["mastery","judgment"],body:"AI lowers the bar to produce something, but great engineering, design, and data science remain scarce. The compounding skill is judging what 'good' looks like.",context:{"explanation":"AI has lowered the bar to produce something, but great engineering, design, and data science — the judgment of what 'good' actually looks like — remain genuinely scarce.","why":"As raw output becomes cheap and abundant, the ability to judge quality becomes the actual bottleneck and the more valuable skill to build.","when":"Keep this in mind whenever you're evaluating your own growth plan or a junior person's development plan.","how":"Invest deliberate time in developing taste and judgment — study what 'excellent' looks like in your craft, not just how to produce faster with new tools.","example":"Two PMs can use the same AI tool to draft a strategy doc that looks equally polished at a glance — but only one of them can tell you which parts are actually wrong."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm"],source:undefined},
{category:20,type:"Actionable Advice",title:"Hire and grow for curiosity over static expertise",tags:["hiring","growth mindset"],body:"Prioritize comfort with ambiguity and willingness to keep exploring new tools over narrow, fixed specialization. Treat 'AI fluency' as a mindset, not a checklist.",context:{"explanation":"A hiring and self-development lens: prioritize comfort with ambiguity and genuine curiosity about new tools over narrow, fixed technical specialization.","why":"'AI fluency' is better understood as an experimental mindset than a checklist of specific skills, because tools and techniques change faster than any skill list can track.","when":"Use this in hiring rubrics, interview evaluation criteria, and your own self-assessment during performance reviews.","how":"When evaluating yourself or a candidate, ask: do they show genuine curiosity and willingness to experiment, rather than just listing tools they already know?","example":"Instead of asking a candidate 'do you know prompt engineering,' the more revealing question is to ask them to describe a time they tried something new that didn't work, and what they learned from it."},stages:["10to100","100plus"],levels:["group","director","vp"],source:undefined},
{category:27,type:"Principles",title:"Specialists still win — if they keep re-asking the question",tags:["career development","adaptability"],body:"Deep narrow specialists are declining in relative value against adaptable generalists — but subject-matter expertise remains an advantage for those willing to keep questioning it.",context:{"explanation":"Deep narrow specialists are becoming relatively less valuable compared to adaptable generalists — but specialization is still an advantage for people who keep questioning whether their approach still fits.","why":"The risk isn't specialization itself — it's static specialization, where someone stops re-evaluating whether their expertise still fits the problems in front of them.","when":"Revisit this periodically as a personal check-in, especially after a significant shift in your tools, team, or problem space.","how":"Ask yourself regularly: 'Is my specialty still the best tool for the problems I'm facing now, or am I reaching for it out of habit?'","example":"A payments specialist who spent five years mastering one system starts asking whether that system is even still the right architecture, instead of defending it out of habit."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm"],source:undefined},
{category:18,type:"Real-World Examples",title:"More builders means more shared infrastructure, not less",tags:["scaling","platform"],body:"As AI lets more people build things themselves, invest more — not less — in shared infrastructure and 'paved paths' so rising velocity doesn't outrun quality and safety.",context:{"explanation":"As AI lets more people build things themselves, organizations need to invest more — not less — in shared infrastructure, tooling, and standards ('paved paths').","why":"Without shared infrastructure, more builders moving faster just means more inconsistent, ungoverned output at greater scale.","when":"Apply when your org sees a surge in AI-assisted building — treat the surge as the trigger to invest in platform work, not a reason to relax standards.","how":"When you notice more people building independently, proactively propose or invest in the common tooling, design systems, or data standards that keep that building safe and consistent.","example":"As more of Netflix's teams began prototyping with AI, the company doubled down on shared infrastructure and 'paved paths' rather than letting each team build bespoke, ungoverned tooling."},stages:["10to100","100plus"],levels:["director","vp"],source:undefined},
{category:17,type:"Frameworks",title:"The keeper's test",tags:["performance management","feedback"],body:"Regularly ask, for any direct report: 'if this person told me today they were leaving, would I fight to keep them?' It's mostly a positive, recognition-driving conversation starter.",context:{"explanation":"A performance-management framework: for any direct report, regularly ask yourself, 'if this person told me today they were leaving, would I fight to keep them?'","why":"It forces consistent feedback hygiene and is mostly a positive, recognition-driving conversation — not just an exit-decision tool — which most managers otherwise avoid doing regularly.","when":"Run this mentally before every 1:1 cycle with direct reports, not only when performance is already in question.","how":"Before a 1:1, ask yourself the keeper's-test question, then structure the conversation around what you'd tell them if the answer is a strong yes — or what would need to change if it isn't.","example":"A manager silently asks themselves the keeper's-test question before a 1:1 — and when the honest answer is a strong yes, that becomes the spine of the conversation, told directly to the person."},stages:["0to1","1to10","10to100","100plus"],levels:["group","director","vp"],source:undefined},
{category:19,type:"Frameworks",title:"Excellence as an operating system",tags:["culture","leadership"],body:"Four pillars: non-negotiable talent density; high autonomy/accountability; comfort with risk-taking and fast recovery; and resisting adding process after something goes wrong.",context:{"explanation":"A four-pillar framework for building a culture aimed at excellence: talent density, autonomy pushed deep into the org, comfort with risk-taking, and resisting process-creep after failures.","why":"These pillars work together — talent density makes autonomy safe, and resisting process-creep after failures preserves the speed and ownership the other pillars depend on.","when":"Use when designing or auditing team culture and operating norms, especially during a team's formation or a reset after a rough quarter.","how":"Audit your team against all four pillars explicitly — hiring bar, how deep decisions are pushed, how risk-taking is treated after failures, and your instinct after mistakes.","example":"After a rocky early stretch in a new product bet, leadership treats it as evidence the team took the right kind of risk — not a reason to add a new approval layer."},stages:["10to100","100plus"],levels:["director","vp","cpo"],source:undefined},
{category:1,type:"Actionable Advice",title:"Overlay AI fluency instead of rewriting the ladder",tags:["career ladders","org design"],body:"Rather than rewriting career-ladder criteria for AI, layer one cross-level aspiration — 'AI fluency' — on top of the existing ladder, and let its meaning flex by role and seniority.",context:{"explanation":"Rather than rewriting career-ladder criteria line-by-line for AI, layer one cross-level aspiration — 'AI fluency' — on top of the existing ladder.","why":"A fully rewritten ladder goes stale within a quarter given how fast AI capabilities change; an overlay stays relevant because its meaning can evolve without a full rewrite.","when":"Apply when your org is under pressure to 'update the career ladder for AI.'","how":"Propose a single AI-fluency aspiration statement across all levels, and define per-level or per-role examples of what it looks like — rather than editing every existing ladder criterion.","example":"Instead of rewriting every level of the engineering ladder to mention AI explicitly, a company adds one shared line about AI fluency and lets managers calibrate what it means together."},stages:["10to100","100plus"],levels:["director","vp","cpo"],source:undefined},
{category:17,type:"Principles",title:"Easier tools don't remove the need to teach judgment",tags:["mentorship","junior talent"],body:"Junior team members still need deliberate mentorship on what good looks like, and still own accountability for reviewing, testing, and diagnosing AI-assisted output.",context:{"explanation":"Junior team members still need deliberate mentorship on what 'good' looks like, and still own accountability for reviewing, testing, and diagnosing AI-assisted output.","why":"Tools that produce more, faster, actually raise the mentorship bar rather than lowering it — more output means more that needs someone's trained eye on it.","when":"Apply when onboarding or mentoring junior PMs or engineers who lean heavily on AI tools.","how":"Don't let tool fluency substitute for judgment-building — review AI-assisted output together, and ask the junior person to explain and defend it, not just produce it.","example":"A junior PM ships a well-formatted PRD an AI helped draft in minutes — in review, their manager asks them to walk through why each requirement is there, not just what it says."},stages:["0to1","1to10","10to100","100plus"],levels:["spm","group"],source:undefined},
{category:4,type:"Real-World Examples",title:"Betting that entertainment won't be one thing",tags:["product strategy","portfolio"],body:"Expanding beyond a single core format into games, live events, and podcasts is a bet that the category is fragmenting — shifting the problem to discovery and personalization.",context:{"explanation":"A real-world strategy example: expanding beyond a single core product format into adjacent formats is a bet that the category itself is fragmenting, not just an attempt to produce more content.","why":"This reframes the hard strategic problem from 'produce more' to 'make discovery and personalization seamless across a much wider catalog' — a fundamentally different problem.","when":"Reference this when evaluating any portfolio-expansion strategy for a product.","how":"When considering expanding into a new format, explicitly ask whether your discovery/personalization systems can handle the added breadth — not just whether you can produce the content.","example":"Netflix adding games, live events, and podcasts alongside film and TV is a bet that entertainment itself is fragmenting — the hard problem becomes discovery across all of it, not producing more."},stages:["100plus"],levels:["director","vp","cpo"],source:undefined},
{category:25,type:"Principles",title:"Storytelling is a human-first need",tags:["storytelling","product experience"],body:"Storytelling is one of the oldest human needs. Technology can amplify it, but content that strips the human element from the center tends to land as less compelling.",context:{"explanation":"Storytelling is framed as one of the oldest human needs. Technology can amplify storytelling, but content that strips the human element from the center tends to land as less compelling.","why":"Products built around content or narrative risk losing what actually connects with people if the technology becomes the center of the experience instead of the human story.","when":"Apply when designing any content-driven or narrative-driven product feature.","how":"Before shipping, explicitly check: is there still a human — a creator, character, or storyteller — at the center of this experience?","example":"A technically impressive, fully AI-generated show can still feel hollow next to one built around a real performer's presence — audiences gravitate to the human at the center."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm"],source:undefined},
{category:27,type:"Actionable Advice",title:"Two small resilience heuristics",tags:["resilience","life motto"],body:"Watch for the one good thing that happens each day, even in stressful stretches; and remember that the last 5% of effort is usually what makes the difference.",context:{"explanation":"Two simple daily practices for sustaining resilience under pressure: actively watch for the one good thing each day, and remember the last 5% of effort usually matters most.","why":"Small, repeatable habits like these are more sustainable under chronic pressure than one-off motivational efforts, because they don't depend on a big moment of willpower.","when":"Use daily, especially during high-stress stretches at work — this is a standing practice, not a one-time fix.","how":"At the end of each day, name one good thing that happened. And before calling something 'done,' ask if there's one more pass of effort that would meaningfully improve it.","example":"On a genuinely rough week, before closing the laptop, you jot down the one good thing that happened — even something small — and give the doc one more pass before calling it done."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:undefined},
{category:24,type:"Principles",title:"Let people make the call you disagree with",tags:["decision making","delegation"],body:"When you disagree with a non-catastrophic decision a report or peer made, the higher-leverage move is to let it stand and revisit it together afterward.",context:{"explanation":"When you disagree with a decision a report or peer made, and it isn't catastrophic, the higher-leverage move is to let it stand and revisit it together afterward.","why":"Constant correction prevents people from building their own judgment; letting non-catastrophic decisions play out — then reflecting together — builds better long-term judgment.","when":"Apply in the moment you feel the urge to overrule a report's or peer's decision.","how":"Before stepping in, ask: is this truly catastrophic, or just different from what I'd have done? If not catastrophic, let it play out and schedule a reflection conversation.","example":"A direct report picks a slightly different technical approach than you would have. It won't sink the project, so you let it play out and talk it through together afterward, win or lose."},stages:["0to1","1to10","10to100","100plus"],levels:["group","director","vp"],source:undefined},
{category:23,type:"Principles",title:"Resist the urge to add process after a failure",tags:["organizational behavior","process"],body:"The default instinct after something goes wrong is to add a constraint or process step — that usually doesn't produce better outcomes.",context:{"explanation":"The default organizational instinct after something goes wrong is to add a constraint or process step — but that usually doesn't produce better outcomes.","why":"Process added reactively tends to slow everyone down going forward without actually preventing the next, different failure — shared learning is more adaptive.","when":"Apply immediately after any postmortem or retro, right when the instinct to add a rule is strongest.","how":"Before proposing a new rule, ask instead: 'how do we share this learning so people make better judgment calls next time?'","example":"After an outage, instead of adding a new sign-off step to every future deploy, the team writes up what they learned and shares it widely, trusting people to apply the lesson."},stages:["10to100","100plus"],levels:["group","director","vp"],source:undefined},
{category:15,type:"Principles",title:"Understanding beats writing, as agents write more code",tags:["engineering","AI-native work"],body:"As agents write more code, the durable skill shifts from writing a language to explaining why a system works, diagnosing it when it breaks, and judging its output.",context:{"explanation":"As agents take on more of the actual coding, the durable engineering skill shifts from writing a given language to explaining why a system works and judging its output.","why":"If no one on the team understands why a system works, nobody can safely fix it when it breaks or trust its output under pressure.","when":"Apply when planning technical skill development for yourself or your team in an AI-assisted engineering environment.","how":"When reviewing AI-generated code, prioritize being able to explain how and why it works over how quickly it was produced — build this into code review norms.","example":"An agent writes working code that ships fine — until it breaks in production, and the engineer who reviewed it can explain exactly why it worked and how to fix it, because they understood it rather than just approving it."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm"],source:undefined},
{category:3,type:"Actionable Advice",title:"Use AI to retrieve your own institutional memory first",tags:["research ops","institutional knowledge"],body:"Before running new research, use AI to rapidly retrieve and distill what your organization already learned as a starting hypothesis — then validate it with an expert.",context:{"explanation":"Before running new research, use AI to rapidly retrieve and distill what your organization already learned — past experiments, past user research — as a starting hypothesis.","why":"It's much faster than pinging a colleague or starting from scratch, and it prevents you from re-learning something the organization already knows.","when":"Apply at the very start of any new discovery effort, before scheduling new research.","how":"Ask an AI tool connected to your team's research history: 'what have we already learned about X?' Then validate whatever it surfaces with a subject-matter expert.","example":"Instead of emailing a colleague 'do you remember what we found out about X,' a PM asks an AI tool connected to the team's research archive first, then confirms the answer with whoever actually ran the study."},stages:["10to100","100plus"],levels:["pm","spm"],source:undefined},
{category:1,type:"Actionable Advice",title:"Compete on persona fit, not just compensation",tags:["talent strategy","positioning"],body:"Attracting talent against well-funded competitors works better by naming the specific kind of person who thrives at your company than by out-bidding generically on pay.",context:{"explanation":"Against well-funded competitors, attracting talent works better by being explicit about the specific kind of person who thrives at your company than by out-bidding on pay alone.","why":"Being generic about 'we pay well and do interesting work' doesn't differentiate you; naming the specific persona who loves what your company does helps the right people self-select in.","when":"Apply when writing job descriptions or talking to candidates at a company that can't win purely on compensation.","how":"Explicitly describe the kind of person who thrives at your company in job postings and interview conversations, rather than leading with generic perks.","example":"Instead of a posting that says 'competitive pay, great culture,' the stronger version says 'built for people who love bringing entertainment and technology together' — language that helps the right people self-select in."},stages:["0to1","1to10","10to100","100plus"],levels:["director","vp","cpo"],source:undefined},
{category:20,type:"Principles",title:"Don't sabotage yourself before you start",tags:["imposter syndrome","self-limiting beliefs"],body:"Believing power or self-promotion is 'dirty' is itself the first obstacle — that belief quietly stops people from doing what their career actually requires. Pre-emptive apologizing and self-doubting language signal to others that you don't think you deserve to be there.",context:{"explanation":"This is the first of the 'seven rules of power': many people get in their own way before any external barrier shows up, most often through discomfort with power itself, or imposter-syndrome habits like apologizing before speaking.","why":"If you believe power is something to avoid, you'll unconsciously avoid the behaviors — visibility, self-advocacy, asking for what you need — your career depends on. Self-doubting language leaks out: if you don't think you deserve the room, others start to agree.","when":"Notice this the moment you catch yourself prefacing a comment with 'I don't know if this is useful, but...' or feeling that pursuing influence is somehow beneath you.","how":"Drop the pre-emptory apology entirely — if a comment isn't useful, don't make it; if it is, don't apologize for it. Separately, catch and challenge any internal story that says you don't belong or don't deserve the role you're already in.","example":"In interviews with executives, Jeffrey Pfeffer found the most senior people had mastered not revealing what they privately think of someone — because visibly acting on doubt (about yourself or a colleague) poisons the working relationship before it starts."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm"],source:SOURCE_JP,batch:2},
{category:35,type:"Key Takeaways",title:"Political skill predicts career outcomes",tags:["career growth","research"],body:"Research using Gerald Ferris's political skill scale consistently links this skill to higher salary, more promotions, and lower stress — it's one of the more reliably measured predictors of career outcomes, not a soft nice-to-have.",context:{"explanation":"'Political skill' here doesn't mean manipulation — it means the ability to understand organizational dynamics and get things done through and with other people.","why":"Most careers stall not from lack of competence but from an inability to translate competence into visibility, trust, and cooperation from others — exactly what political skill measures.","when":"Worth revisiting anytime you're tempted to dismiss 'office politics' entirely as beneath your work — the research suggests that stance has a real cost.","how":"Treat relationship-building, visibility, and organizational awareness as core professional skills to develop deliberately, the same way you'd develop a technical skill.","example":"Jeffrey Pfeffer cites this research as the reason his 'Paths to Power' course is one of the most oversubscribed at Stanford's MBA program, despite how uncomfortable the material makes people at first."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:35,type:"Actionable Advice",title:"Nobody promotes someone they don't know exists",tags:["personal brand","visibility"],body:"You can't be chosen for what's not in someone's head. Competence isn't sufficient if the people who make advancement decisions don't know who you are — visibility is a prerequisite, not an optional extra.",context:{"explanation":"There are always fewer senior roles than junior ones, so something has to make you the person who comes to mind when an opportunity opens up.","why":"Substance without visibility means your value never reaches the people who could act on it. You need both, but substance alone quietly fails far more often.","when":"Apply this when you notice you're doing strong work that nobody outside your immediate team seems aware of.","how":"Do something that creates visible value beyond your assigned tasks — write, present, take on a cross-team initiative, or build something that gets your name attached to a result people care about.","example":"A consultant at Deloitte who wasn't strong at the core spreadsheet work instead built an internal award program, took the firm's brand recognition from ~1% to 30%, and was fast-tracked to partner and the firm's first chief marketing officer."},stages:["0to1","1to10","10to100","100plus"],levels:["apm","pm","spm"],source:SOURCE_JP,batch:2},
{category:22,type:"Principles",title:"Skills you don't use, you lose",tags:["skill retention","practice"],body:"Learning fades if it isn't put into practice, the same way a language you stop speaking fades. This is why real behavior-change programs pair teaching with a mandatory 'do something with it' component, not just content delivery.",context:{"explanation":"Knowledge without application decays quickly — an insight only compounds if the idea gets tested against a real situation, not just read.","why":"This is the direct justification for why serious skill-building has to include practice, not just exposure to the idea.","when":"Apply this any time you finish learning something you actually want to keep — a framework, a negotiation tactic, a new habit.","how":"Immediately attach a small real-world action to anything you want to retain — don't let more than a few days pass between learning an idea and trying it once, even in a low-stakes way.","example":"Stanford's 'Paths to Power' course requires a term-long 'Doing Power' project — one student's assignment led to being offered a role running economic policy for a presidential campaign, and six years later he was effectively running the $6 trillion US federal budget."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:31,type:"Principles",title:"Breaking the rules makes you memorable",tags:["differentiation","disruption"],body:"Doing something unexpected makes you stand out, and most existing rules were written by the people the rules already favor. Being a 'disruptor' in your own career works the same way it works in business strategy.",context:{"explanation":"This reframes rule-breaking not as recklessness but as a deliberate differentiation strategy — the same logic that makes companies like Southwest or Amazon stand out in their industries.","why":"If you do exactly what everyone else does, you're competing on the same dimensions as everyone else — and in a hierarchy with limited spots at the top, sameness doesn't get you noticed.","when":"Consider this when a 'conventional wisdom' rule in your field or company seems to mostly benefit people who already have an advantage.","how":"Identify one widely-accepted norm in your context, and consider what would happen if you deliberately didn't follow it — starting small, in a way that plays to your actual strengths.","example":"Investor Jason Calacanis defies venture capital conventions — many small bets instead of a few large ones, no partners so he can't be overruled — and built significant wealth and influence by consistently not doing it the standard way."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm","group"],source:SOURCE_JP,batch:2},
{category:26,type:"Actionable Advice",title:"Just ask — the downside is smaller than you think",tags:["asking for help","research"],body:"People consistently overestimate how many people they'll need to ask before getting help, and overestimate how uncomfortable asking will feel. If the answer is no, you're exactly where you'd have been if you'd never asked.",context:{"explanation":"This targets a specific piece of conventional career advice — 'show self-sufficiency, don't ask for help' — and argues it's actively costly.","why":"The math is asymmetric: asking has almost no downside (a 'no' leaves you where you started) but has real upside (a 'yes' gets you something you wouldn't have had).","when":"Apply this the next time you catch yourself deciding not to ask for something — help, an introduction, a meeting, a favor — because it feels uncomfortable.","how":"Ask directly, plainly, and without excessive hedging. Treat 'no' as a neutral, expected outcome rather than a personal referendum.","example":"Jeffrey Pfeffer describes asking his late wife out repeatedly over the course of their courtship — persistence in asking, not any special charm, was what got the relationship started."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:26,type:"Principles",title:"Lead with generosity, not extraction",tags:["networking","generosity"],body:"The first principle of effective networking is generosity — what can I do for you, who can I introduce you to — not what can I get. People who network this way become genuinely useful to connect.",context:{"explanation":"This reframes networking away from the transactional, cringe-inducing version (working a room for personal gain) toward genuinely connecting people and ideas.","why":"Generosity-first networking is what makes a network durable and pleasant to be part of — extraction-first networking burns relationships and gets noticed for the wrong reasons.","when":"Apply this whenever you're about to reach out to someone new — lead the message with something you can offer or a connection you can make, not an ask.","how":"Before contacting someone, think concretely about what value or introduction you could offer them, and lead with that.","example":"A professor connected an interested philanthropist to a specialist researcher purely because he thought they'd both benefit from knowing each other — both parties ended up materially helped by the introduction."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:26,type:"Frameworks",title:"Become the broker, not just a node",tags:["networking","brokering"],body:"Venture capitalists, investment bankers, and real estate agents make a living connecting people who need each other. You don't need that job title — being the person who connects others creates value and central position for you too.",context:{"explanation":"A 'broker' in a network sits between otherwise-unconnected groups and routes value between them — information, opportunities, introductions.","why":"The more people you know, the more things you know, and the more you can genuinely help others — which compounds your own centrality and value in the network over time.","when":"Apply this whenever you notice two people or groups in your network who don't know each other but clearly should.","how":"Actively look for and make introductions between people in your network who could benefit from knowing each other, even when you have nothing to personally gain.","example":"A well-connected new employee spent his early months at a startup networking broadly across Silicon Valley — and became so well known that when a young company needed to hire its first business person, his name was the one every reference list converged on."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm","group","director"],source:SOURCE_JP,batch:2},
{category:26,type:"Mental Models",title:"Seek out weak ties, not just your inner circle",tags:["weak ties","networking"],body:"People close to you tend to know the same people and information you already do. People more loosely connected to you are more likely to carry information and opportunities you don't already have access to.",context:{"explanation":"This is the 'strength of weak ties' idea from sociology: your close network is redundant with you, but your looser connections sit in different parts of the social and professional map.","why":"If you only network within your existing close circle, you mostly just reinforce what you already know — real new opportunities tend to arrive through people who aren't already deeply embedded in your world.","when":"Apply this when you're job-searching, looking for new opportunities, or trying to break into an unfamiliar space.","how":"Deliberately invest some networking effort in people outside your closest circle — former colleagues you've lost touch with, adjacent-industry contacts, acquaintances rather than only close friends.","example":"A landmark study of job-seekers found the best jobs disproportionately came through referrals from people who weren't particularly close to the job-seeker — precisely because those looser contacts had a different view into the job market."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:19,type:"Principles",title:"Demonstrated results attract more resources",tags:["execution","resource allocation"],body:"Using the authority you're given to actually get things done creates a self-reinforcing cycle: people want to associate with success, so success attracts more opportunity and trust — while an unused mandate quietly shrinks.",context:{"explanation":"This describes why 'using your power' is itself one of the rules for building more of it — visible execution is what earns the next round of resources and trust.","why":"Nobody hands more responsibility to someone who couldn't execute on the last five things they were given — consistent execution is the actual mechanism by which scope grows.","when":"Apply this when you're given any new authority, budget, or mandate, however small — treat visibly using it well as the thing that earns the next one.","how":"When given resources or authority, prioritize converting them into a visible result quickly, rather than sitting on them cautiously — visible use, even imperfect, builds more trust than caution does.","example":"A leader who doubted she deserved a promotion told her new team exactly that — and, predictably, struggled, because broadcasting self-doubt about a mandate undermines the very execution that would have justified it."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm","group","director"],source:SOURCE_JP,batch:2},
{category:34,type:"Principles",title:"How you show up outweighs what you say",tags:["presence","body language"],body:"People respond most to how you look, second to how you sound, and least to the actual content of what you say. This can be deliberately practiced, the same way an actor learns to command a room.",context:{"explanation":"This is a claim about the relative weight of physical presence, vocal delivery, and verbal content in how persuasive or credible someone appears — presence and delivery outweigh content by a wide margin.","why":"If you invest only in having the right answer and ignore how you deliver it, you're optimizing the smallest lever in the equation — this is why even highly competent people can fail to land their message.","when":"Apply this before any high-stakes presentation, negotiation, or moment where you need to be read as credible and in command.","how":"Practice: don't read from notes, make eye contact, keep your point brief, use an open posture, and speak with a fuller voice than feels natural at first.","example":"In a classroom exercise, students shown 30–60 seconds of two CEOs facing scandal — with no sound — could correctly predict which one would keep his job, based purely on physical presence."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:34,type:"Checklists",title:"A short, practiced checklist for appearing powerful",tags:["presence","checklist"],body:"Don't read from notes. Make eye contact. Keep it brief. Use open gestures and posture. Speak louder than feels natural. Allow appropriate physical closeness. Don't over-apologize. These are specific, practicable behaviors, not abstract advice.",context:{"explanation":"This is a concrete, trainable checklist drawn from research and observed executive behavior for how to physically and vocally project authority in a room.","why":"Vague advice like 'be more confident' isn't actionable — a specific checklist of physical behaviors is something you can actually rehearse and get feedback on.","when":"Use this before any moment where you need to be read as in command — a pitch, a difficult conversation, a leadership presentation.","how":"Pick two or three items from the list to deliberately practice at a time (e.g. eye contact and no notes) rather than trying to change everything at once.","example":"A five-foot-two lobbyist who never used notes in front of Congress, and who students later described as 'feeling taller than he is,' was consistently rated one of the most effective operators in Washington."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:27,type:"Frameworks",title:"Push your comfort zone 15% at a time",tags:["growth","incremental change"],body:"Don't try to jump straight to the hardest version of an uncomfortable skill. Build it incrementally, with each step only slightly harder than the last, so the stretch is real but survivable.",context:{"explanation":"This is a practical framework for behavior change: growth happens at the edge of your comfort zone, not far outside it — push too hard and people quit; stay inside it and nothing changes.","why":"Telling someone to do something wildly outside their comfort zone usually just produces avoidance — a small, survivable stretch is what actually gets practiced and repeated.","when":"Apply this whenever you're building a genuinely uncomfortable skill — networking, self-promotion, public speaking, difficult conversations.","how":"Identify your current comfort level with the skill, then choose the next challenge that's only modestly harder than what you already do comfortably. Repeat, raising the bar gradually.","example":"A professor's coaching program starts students on small, guided steps — one direct ask, a brief personal statement — rather than immediately demanding bold, high-stakes moves."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:23,type:"Principles",title:"What you did to get power gets forgiven, forgotten, or both",tags:["power dynamics","reputation"],body:"Once someone has acquired significant power or success, people tend to overlook or forget how they got there. This isn't how the world should work, but it's a consistent enough pattern that ignoring it leads to bad predictions.",context:{"explanation":"This names a real, if uncomfortable, pattern: proximity to power, money, and success tends to soften scrutiny of how that power was acquired.","why":"Believing the world is 'homeostatic' — that bold moves always get punished — leads people to hold back from necessary, ambitious action out of a fear that isn't well supported by how these dynamics actually play out.","when":"Keep this in mind when fear of long-term reputational consequence is the main thing stopping you from taking a bold, legitimate career risk.","how":"Don't let an exaggerated fear of permanent reputational damage stop you from pursuing ambitious, legitimate opportunities — assess real risk rather than an imagined worst case.","example":"Multiple public figures who took major reputational hits were later observed still commanding influence, resources, and social access — illustrating how quickly proximity to success can outweigh historical scrutiny."},stages:["0to1","1to10","10to100","100plus"],levels:["group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:20,type:"Powerful Ideas",title:"If you want power used well, good people need to hold it",tags:["ethics of power","mindset reframe"],body:"Refusing to build influence because power feels uncomfortable doesn't make power disappear from the system — it just means it concentrates among people who had no such hesitation.",context:{"explanation":"This is the reframe for people who feel morally uneasy about deliberately building influence: opting out doesn't reduce the total amount of power in play, it just changes who holds it.","why":"Vacating the field on principle has a real cost — it doesn't neutralize power-seeking behavior elsewhere, it just cedes that ground to people less concerned with using power responsibly.","when":"Revisit this any time discomfort with 'playing the game' is making you hold back from pursuing legitimate influence you'd actually use well.","how":"Separate the tool (influence, visibility, positioning) from how it's used — commit to building your own capability while holding yourself to how you'll use it.","example":"A surgeon who initially refused to network, believing the work should speak for itself, was later credited by her own mentor as one of his proudest examples — once she began building influence deliberately, she went on to reshape national screening policy."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:24,type:"Mental Models",title:"Reduce the friction instead of just pushing harder against it",tags:["effectiveness","friction"],body:"Enormous energy and intelligence can still be less effective than they should be if spent overcoming avoidable, self-created friction. Reducing that friction can unlock far more impact than simply applying more force.",context:{"explanation":"This is a physics-inspired mental model: force applied against friction can still move something, but the same force applied with less friction moves it further, faster, with less waste.","why":"It's tempting to interpret resistance to your ideas as something to simply push through with more effort — but some of that resistance is self-created by approach or tone, and is genuinely reducible.","when":"Apply this when you notice you're consistently meeting resistance despite being right on the substance — ask whether the friction is coming from the idea itself or from how it's delivered.","how":"Before pushing harder, ask what's creating friction in how you're operating — an unbuilt relationship, a stakeholder dismissed as not worth engaging? Reduce that first, then push.","example":"A brilliant physician who refused to build relationships was told by a mentor she was creating unnecessary friction — after investing in relationships, she went on to reshape national medical screening standards."},stages:["0to1","1to10","10to100","100plus"],levels:["pm","spm","group","director"],source:SOURCE_JP,batch:2},
{category:28,type:"Principles",title:"Power and full autonomy rarely coexist",tags:["tradeoffs","autonomy"],body:"Real positional power comes with a loss of control over your own time, privacy, and schedule. This is a genuine tradeoff, not a solvable inconvenience.",context:{"explanation":"This names an explicit tradeoff: as positional power and visibility increase, personal autonomy — control over your own schedule, privacy, and time — tends to decrease correspondingly.","why":"People sometimes pursue power assuming it will grant them more freedom; understanding this tradeoff up front leads to a more honest choice about which one you actually want more.","when":"Consider this explicitly before pursuing a role that offers significant positional power — ask what you'd be trading away, not just what you'd gain.","how":"Before taking a high-power, high-visibility role, be explicit with yourself about how much control over your own time and privacy you're willing to give up.","example":"A dean whose wife was dying of cancer still had to keep his public schedule of alumni events and fundraising — power came with obligations that didn't pause even for a personal crisis."},stages:["0to1","1to10","10to100","100plus"],levels:["director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:27,type:"Actionable Advice",title:"Get a coach or support system for anything genuinely uncomfortable",tags:["coaching","support"],body:"Doing something uncomfortable alone is much harder than doing it with structured support — a coach, an accountability group, or a small circle who give feedback and hold you to your own goals.",context:{"explanation":"This is the practical starting recommendation for building any of the power-related skills discussed: don't try to build discomfort tolerance in isolation.","why":"Social support provides accountability, calibrated feedback, and encouragement that's very hard to generate for yourself — most successful behavior change happens with some form of structured outside support.","when":"Apply this any time you identify a skill you know you should build but have been avoiding because it feels uncomfortable or you're not sure you're doing it right.","how":"Find a coach, mentor, or small group who will give you honest feedback and hold you accountable to specific, practiced steps — not just cheerlead you.","example":"A well-known podcast host was told directly he would not have built his show entirely alone, without help — the same principle applies to building any of these career-power skills."},stages:["0to1","1to10","10to100","100plus"],levels:["fresher","apm","pm","spm","group","director","vp","cpo"],source:SOURCE_JP,batch:2},
{category:17,type:"Principles",title:"Suspend judgment of anyone on your critical path",tags:["stakeholder management","collaboration"],body:"If someone's cooperation is necessary for your work, privately deciding they're incompetent or difficult — and letting that show — will wreck your ability to work with them. The only judgment that matters: this person is on my critical path.",context:{"explanation":"This reframes 'don't be judgmental' from a moral platitude into a practical operating principle for anyone who depends on cross-functional cooperation to get things done.","why":"Most jobs require real interdependence — if your private opinion of a needed collaborator leaks out (and it usually does), your ability to build the working relationship you need drops close to zero.","when":"Apply this whenever you notice frustration or a negative judgment forming about someone whose cooperation you still need.","how":"Separate your personal opinion of someone from your need for their cooperation — actively withhold visible judgment (tone, body language, comments to others) about anyone still on your critical path.","example":"Senior executives who are effective at this are described as having mastered not letting others read what they actually think of them — because leaking visible disrespect toward someone whose cooperation you need reliably destroys the relationship."},stages:["0to1","1to10","10to100","100plus"],levels:["apm","pm","spm","group"],source:SOURCE_JP,batch:2}
];

let insights = SEED.map((s, i) => ({ id: 'seed-'+i, batch: 1, ...s, source: s.source || SOURCE_ES }));

let activeCategory = null;
let currentUser = null;
let bookmarkedIds = new Set();
let bookmarksOnly = false;
let currentPage = 1;
let activeStages = new Set();
let activeLevels = new Set();
const collapsedChipFilters = new Set(['Company/Product Stage', 'PM Career Level']);

function itemsPerPage(){
  const w = window.innerWidth;
  if (w >= 1400) return 6;
  if (w >= 1100) return 4;
  if (w >= 760)  return 3;
  if (w >= 480)  return 2;
  return 1;
}
let activeSourceKey = null;
let sidebarView = 'category'; // 'category' | 'source'
let recentOnly = false;
let query = '';
const collapsedClusters = new Set();

function sourceKey(source){
  if (!source) return 'unknown';
  return source.kind === 'book' ? 'book::'+(source.book||'') : 'podcast::'+(source.podcast||'')+'::'+(source.episode||'');
}
function sourceLabel(source){
  if (!source) return 'Unknown source';
  return source.kind === 'book' ? (source.book || 'Untitled book') : (source.episode || source.podcast || 'Untitled episode');
}
function sourceSubLabel(source){
  if (!source) return '';
  return source.kind === 'book' ? (source.author ? 'by '+source.author : '') : (source.guest ? 'with '+source.guest : source.podcast||'');
}
function latestBatch(){
  return insights.reduce((max, i) => Math.max(max, i.batch||0), 0);
}

function renderSidebar(){
  const el = document.getElementById('sidebar');
  el.innerHTML = '';

  const searchWrap = document.createElement('div');
  searchWrap.className = 'search-box';
  searchWrap.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" aria-label="Search insights, tags, sources" placeholder="Search insights, tags, sources…" value="${query.replace(/"/g,'&quot;')}" />
  `;
  el.appendChild(searchWrap);

  const buildChipFilter = (label, options, nameFn, activeSet) => {
    const wrap = document.createElement('div');
    wrap.className = 'chip-filter';
    const head = document.createElement('div');
    head.className = 'chip-filter-head';
    head.tabIndex = 0;
    head.setAttribute('role', 'button');
    const collapsed = collapsedChipFilters.has(label);
    head.setAttribute('aria-expanded', String(!collapsed));
    const countBadge = activeSet.size ? `<span class="chip-filter-count">${activeSet.size}</span>` : '';
    head.innerHTML = `<span class="chip-filter-label">${label}${countBadge}</span><span class="cluster-caret" style="${collapsed?'transform:rotate(-90deg);':''}">▾</span>`;
    const toggleOpen = () => {
      collapsedChipFilters.has(label) ? collapsedChipFilters.delete(label) : collapsedChipFilters.add(label);
      renderSidebar();
    };
    head.onclick = toggleOpen;
    head.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleOpen(); } };
    wrap.appendChild(head);
    if (!collapsed){
      const row = document.createElement('div');
      row.className = 'chip-filter-row';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-chip' + (activeSet.has(opt.id) ? ' active' : '');
        btn.textContent = nameFn(opt.id);
        btn.setAttribute('aria-pressed', String(activeSet.has(opt.id)));
        btn.onclick = () => {
          activeSet.has(opt.id) ? activeSet.delete(opt.id) : activeSet.add(opt.id);
          currentPage = 1;
          renderAll();
        };
        row.appendChild(btn);
      });
      wrap.appendChild(row);
    }
    return wrap;
  };
  el.appendChild(buildChipFilter('Company/Product Stage', STAGES, stageName, activeStages));
  el.appendChild(buildChipFilter('PM Career Level', LEVELS, levelName, activeLevels));

  const recent = latestBatch();
  const recentCount = insights.filter(i => i.batch === recent).length;
  const recentBtn = document.createElement('button');
  recentBtn.className = 'recent-chip' + (recentOnly ? ' active' : '');
  recentBtn.type = 'button';
  recentBtn.innerHTML = `✨ Recently added <span class="recent-count">${recentCount}</span>`;
  recentBtn.onclick = () => { recentOnly = !recentOnly; currentPage = 1; renderAll(); };
  el.appendChild(recentBtn);

  if (sb){
    const bmBtn = document.createElement('button');
    bmBtn.className = 'recent-chip' + (bookmarksOnly ? ' active' : '');
    bmBtn.type = 'button';
    bmBtn.innerHTML = currentUser
      ? `★ My bookmarks <span class="recent-count">${bookmarkedIds.size}</span>`
      : `★ My bookmarks <span class="recent-count">sign in</span>`;
    bmBtn.onclick = () => {
      if (!currentUser){ document.getElementById('signInBtn')?.click(); return; }
      bookmarksOnly = !bookmarksOnly; currentPage = 1; renderAll();
    };
    el.appendChild(bmBtn);
  }

  const viewTabs = document.createElement('div');
  viewTabs.className = 'view-tabs';
  viewTabs.innerHTML = `
    <button class="view-tab${sidebarView==='category'?' active':''}" id="viewTabCategory" type="button">By Category</button>
    <button class="view-tab${sidebarView==='source'?' active':''}" id="viewTabSource" type="button">By Source</button>
  `;
  el.appendChild(viewTabs);
  document.getElementById('viewTabCategory').onclick = () => { sidebarView = 'category'; activeSourceKey = null; renderAll(); };
  document.getElementById('viewTabSource').onclick = () => { sidebarView = 'source'; activeCategory = null; renderAll(); };

  if (activeCategory || activeSourceKey || query || recentOnly || bookmarksOnly || activeStages.size || activeLevels.size){
    const filters = document.createElement('div');
    filters.className = 'active-filters';
    if (activeCategory){
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${catName(activeCategory)} <button aria-label="Clear category filter">×</button>`;
      chip.querySelector('button').onclick = () => { activeCategory = null; renderAll(); };
      filters.appendChild(chip);
    }
    if (activeSourceKey){
      const item = insights.find(i => sourceKey(i.source) === activeSourceKey);
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(sourceLabel(item && item.source))} <button aria-label="Clear source filter">×</button>`;
      chip.querySelector('button').onclick = () => { activeSourceKey = null; renderAll(); };
      filters.appendChild(chip);
    }
    activeStages.forEach(id => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(stageName(id))} <button aria-label="Clear this stage filter">×</button>`;
      chip.querySelector('button').onclick = () => { activeStages.delete(id); currentPage = 1; renderAll(); };
      filters.appendChild(chip);
    });
    activeLevels.forEach(id => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeHtml(levelName(id))} <button aria-label="Clear this level filter">×</button>`;
      chip.querySelector('button').onclick = () => { activeLevels.delete(id); currentPage = 1; renderAll(); };
      filters.appendChild(chip);
    });
    if (recentOnly){
      const chip = document.createElement('span');
      chip.className = 'chip';
