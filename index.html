      chip.innerHTML = `Recently added <button aria-label="Clear recently-added filter">×</button>`;
      chip.querySelector('button').onclick = () => { recentOnly = false; renderAll(); };
      filters.appendChild(chip);
    }
    if (bookmarksOnly){
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `My bookmarks <button aria-label="Clear bookmarks filter">×</button>`;
      chip.querySelector('button').onclick = () => { bookmarksOnly = false; renderAll(); };
      filters.appendChild(chip);
    }
    const clearAll = document.createElement('button');
    clearAll.className = 'clear-all';
    clearAll.textContent = 'Clear all';
    clearAll.onclick = () => { activeCategory = null; activeSourceKey = null; recentOnly = false; bookmarksOnly = false; activeStages.clear(); activeLevels.clear(); query = ''; currentPage = 1; renderAll(); };
    filters.appendChild(clearAll);
    el.appendChild(filters);
  }

  const scrollBox = document.createElement('div');
  scrollBox.className = 'category-scroll';

  if (sidebarView === 'category'){
    CLUSTERS.forEach(cluster => {
      const wrap = document.createElement('div');
      wrap.className = 'cluster' + (collapsedClusters.has(cluster.id) ? ' collapsed' : '');
      const head = document.createElement('div');
      head.className = 'cluster-head';
      head.tabIndex = 0;
      head.setAttribute('role', 'button');
      head.setAttribute('aria-expanded', String(!collapsedClusters.has(cluster.id)));
      head.innerHTML = `<span class="cluster-title">${cluster.name}</span><span class="cluster-caret">▾</span>`;
      const toggleCluster = () => {
        collapsedClusters.has(cluster.id) ? collapsedClusters.delete(cluster.id) : collapsedClusters.add(cluster.id);
        renderSidebar();
      };
      head.onclick = toggleCluster;
      head.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleCluster(); } };
      wrap.appendChild(head);
      const list = document.createElement('ul');
      list.className = 'cat-list';
      cluster.categories.forEach(cat => {
        const count = insights.filter(i => i.category === cat.id).length;
        const li = document.createElement('li');
        li.className = 'cat-item' + (activeCategory === cat.id ? ' active' : '');
        li.style.setProperty('--cat-color', catColor(cat.id));
        li.tabIndex = 0;
        li.setAttribute('role', 'button');
        li.setAttribute('aria-pressed', String(activeCategory === cat.id));
        li.innerHTML = `<span class="cat-dot"></span><span class="cat-name">${cat.name}</span><span class="cat-count">${count}</span>`;
        const toggleCat = () => { activeCategory = (activeCategory === cat.id ? null : cat.id); currentPage = 1; renderAll(); };
        li.onclick = toggleCat;
        li.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleCat(); } };
        list.appendChild(li);
      });
      wrap.appendChild(list);
      scrollBox.appendChild(wrap);
    });
  } else {
    const groups = {};
    insights.forEach(i => {
      const key = sourceKey(i.source);
      if (!groups[key]) groups[key] = { source: i.source, count: 0 };
      groups[key].count++;
    });
    const podcasts = Object.entries(groups).filter(([k]) => k.startsWith('podcast::'));
    const books = Object.entries(groups).filter(([k]) => k.startsWith('book::'));

    const renderGroup = (label, entries) => {
      if (!entries.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'cluster';
      const head = document.createElement('div');
      head.className = 'cluster-head';
      head.innerHTML = `<span class="cluster-title">${label}</span>`;
      wrap.appendChild(head);
      const list = document.createElement('ul');
      list.className = 'cat-list';
      entries.forEach(([key, g]) => {
        const li = document.createElement('li');
        li.className = 'cat-item' + (activeSourceKey === key ? ' active' : '');
        li.style.setProperty('--cat-color', 'var(--gold)');
        li.tabIndex = 0;
        li.setAttribute('role', 'button');
        li.setAttribute('aria-pressed', String(activeSourceKey === key));
        li.innerHTML = `<span class="cat-dot"></span><span class="cat-name">${escapeHtml(sourceLabel(g.source))}<br><span style="opacity:.6;font-size:11px;">${escapeHtml(sourceSubLabel(g.source))}</span></span><span class="cat-count">${g.count}</span>`;
        const toggleSrc = () => { activeSourceKey = (activeSourceKey === key ? null : key); currentPage = 1; renderAll(); };
        li.onclick = toggleSrc;
        li.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleSrc(); } };
        list.appendChild(li);
      });
      wrap.appendChild(list);
      scrollBox.appendChild(wrap);
    };
    renderGroup('Podcasts', podcasts);
    renderGroup('Books', books);
    if (!podcasts.length && !books.length){
      scrollBox.appendChild(Object.assign(document.createElement('p'), { className: 'empty-state', textContent: 'No sources yet.' }));
    }
  }
  el.appendChild(scrollBox);


  document.getElementById('searchInput').oninput = (e) => {
    query = e.target.value;
    currentPage = 1;
    renderCards(); renderStats(); updateHeading();
  };
}

function matches(item){
  if (activeCategory && item.category !== activeCategory) return false;
  if (activeSourceKey && sourceKey(item.source) !== activeSourceKey) return false;
  if (recentOnly && item.batch !== latestBatch()) return false;
  if (bookmarksOnly && !bookmarkedIds.has(item.id)) return false;
  if (activeStages.size && !(item.stages||[]).some(s => activeStages.has(s))) return false;
  if (activeLevels.size && !(item.levels||[]).some(l => activeLevels.has(l))) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  const src = item.source || {};
  const ctx = item.context || {};
  const hay = [
    item.title, item.body, item.type, catName(item.category),
    ctx.explanation, ctx.why, ctx.when, ctx.how, ctx.example,
    (item.tags||[]).join(' '),
    (item.stages||[]).map(stageName).join(' '), (item.levels||[]).map(levelName).join(' '),
    src.podcast, src.host, src.guest, src.episode, src.book, src.author, src.chapter
  ].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}


function renderSource(source){
  if (!source) return '';
  if (source.kind === 'book'){
    return `<div class="card-source">
      <span class="src-kind">Book</span>
      <span class="podcast">${escapeHtml(source.book||'')}</span>
      ${source.author ? `<span>Author: ${escapeHtml(source.author)}</span>` : ''}
      ${source.chapter ? `<span>${escapeHtml(source.chapter)}</span>` : ''}
    </div>`;
  }
  return `<div class="card-source">
    <span class="src-kind">Podcast</span>
    <span class="podcast">${escapeHtml(source.podcast||'')}</span>
    ${source.host ? `<span>Host: ${escapeHtml(source.host)}</span>` : ''}
    ${source.guest ? `<span>Guest: ${escapeHtml(source.guest)}</span>` : ''}
  </div>`;
}

function renderCards(){
  const area = document.getElementById('cardArea');
  const filtered = insights.filter(matches);
  area.innerHTML = '';
  if (!filtered.length){
    area.innerHTML = `<div class="empty-state">No insights match yet. Try a different search, or clear the category filter.</div>`;
    return;
  }

  const perPage = itemsPerPage();
  const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * perPage;
  const pageItems = filtered.slice(start, start + perPage);

  const grid = document.createElement('div');
  grid.className = 'grid';
  pageItems.forEach((item) => {
    const color = catColor(item.category);
    const cardId = 'PMN-' + String(insights.indexOf(item) + 1).padStart(3, '0');
    const card = document.createElement('article');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${item.title} — ${catName(item.category)}, ${item.type || 'insight'}. Open for full context.`);
    card.innerHTML = `
      <div class="card-top-row">
        <div class="card-top">
          <span class="card-id">${cardId}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            ${item.batch === latestBatch() && latestBatch() > 1 ? '<span class="new-badge">New</span>' : ''}
            <span class="card-type">${escapeHtml(item.type || 'Insight')}</span>
          </span>
        </div>
        ${sb ? `<button class="bookmark-btn${bookmarkedIds.has(item.id) ? ' saved' : ''}" data-bm="${escapeHtml(item.id)}" aria-label="${bookmarkedIds.has(item.id) ? 'Remove bookmark' : 'Add bookmark'}" type="button">★</button>` : ''}
      </div>
      <div class="card-cat" style="--cat-color:${color}"><span class="cat-dot"></span>${catName(item.category)}</div>
      <h3>${escapeHtml(item.title)}</h3>
      <p class="body">${escapeHtml(item.body)}</p>
      ${item.tags && item.tags.length ? `<div class="card-tags">${item.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="card-hint">Click for explanation, why, when &amp; how →</div>
      ${renderSource(item.source)}
    `;
    card.onclick = () => openModal(item, cardId, color, card);
    card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(item, cardId, color, card); } };
    const bmBtn = card.querySelector('.bookmark-btn');
    if (bmBtn){
      bmBtn.onclick = (e) => { e.stopPropagation(); toggleBookmark(item.id); };
    }
    grid.appendChild(card);
  });
  area.appendChild(grid);

  if (totalPages > 1){
    const pager = document.createElement('div');
    pager.className = 'pager';
    const prevBtn = document.createElement('button');
    prevBtn.className = 'pager-btn';
    prevBtn.setAttribute('aria-label', 'Previous page');
    prevBtn.disabled = currentPage <= 1;
    prevBtn.textContent = '←';
    prevBtn.onclick = () => { currentPage--; renderCards(); document.getElementById('mainContent')?.scrollIntoView?.({behavior:'smooth', block:'start'}); };

    const nextBtn = document.createElement('button');
    nextBtn.className = 'pager-btn';
    nextBtn.setAttribute('aria-label', 'Next page');
    nextBtn.disabled = currentPage >= totalPages;
    nextBtn.textContent = '→';
    nextBtn.onclick = () => { currentPage++; renderCards(); document.getElementById('mainContent')?.scrollIntoView?.({behavior:'smooth', block:'start'}); };

    const label = document.createElement('span');
    label.className = 'pager-label';
    label.textContent = `Page ${currentPage} of ${totalPages}`;

    pager.appendChild(prevBtn);
    pager.appendChild(label);
    pager.appendChild(nextBtn);
    area.appendChild(pager);
  }
}

window.addEventListener('resize', () => {
  clearTimeout(window._resizeT);
  window._resizeT = setTimeout(renderCards, 150);
});

let lastFocusedEl = null;

function openModal(item, cardId, color, triggerEl){
  lastFocusedEl = triggerEl || document.activeElement;
  const ctx = item.context || {};
  const panel = document.getElementById('modalPanel');
  panel.setAttribute('aria-labelledby', 'modalTitle');
  panel.innerHTML = `
    <button class="modal-close" id="modalCloseBtn" aria-label="Close">×</button>
    <div class="modal-top"><span class="card-id">${cardId}</span><span class="card-type">${escapeHtml(item.type || 'Insight')}</span>
      ${sb ? `<button class="bookmark-btn${bookmarkedIds.has(item.id) ? ' saved' : ''}" id="modalBookmarkBtn" style="margin-left:auto;" aria-label="${bookmarkedIds.has(item.id) ? 'Remove bookmark' : 'Add bookmark'}" type="button">★</button>` : ''}
    </div>
    <div class="modal-cat" style="--cat-color:${color}"><span class="cat-dot"></span>${catName(item.category)}</div>
    <h2 id="modalTitle">${escapeHtml(item.title)}</h2>
    <p class="body">${escapeHtml(item.body)}</p>
    ${ctx.explanation ? `<div class="modal-section"><h4>What it means</h4><p>${escapeHtml(ctx.explanation)}</p></div>` : ''}
    ${ctx.why ? `<div class="modal-section"><h4>Why it matters</h4><p>${escapeHtml(ctx.why)}</p></div>` : ''}
    ${ctx.when ? `<div class="modal-section"><h4>When to apply</h4><p>${escapeHtml(ctx.when)}</p></div>` : ''}
    ${ctx.how ? `<div class="modal-section"><h4>How to apply</h4><p>${escapeHtml(ctx.how)}</p></div>` : ''}
    ${ctx.example ? `<div class="modal-section"><h4>In practice</h4><p>${escapeHtml(ctx.example)}</p></div>` : ''}
    ${item.tags && item.tags.length ? `<div class="modal-tags">${item.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    ${renderSource(item.source)}
  `;
  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.getElementById('modalBookmarkBtn')?.addEventListener('click', () => toggleBookmark(item.id));
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('modalCloseBtn').focus();
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') lastFocusedEl.focus();
}
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  const backdrop = document.getElementById('modalBackdrop');
  if (!backdrop.classList.contains('open')) return;
  if (e.key === 'Escape'){ closeModal(); return; }
  if (e.key === 'Tab'){
    const focusable = document.getElementById('modalPanel').querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function updateHeading(){
  document.getElementById('mainHeading').textContent = activeCategory ? catName(activeCategory) : 'All insights';
  const count = insights.filter(matches).length;
  document.getElementById('mainCount').textContent = count + (count===1 ? ' insight' : ' insights');
}
function renderStats(){
  document.getElementById('statTotal').textContent = insights.length;
  const sources = new Set(insights.map(i => {
    const s = i.source || {};
    return s.kind === 'book' ? 'book::'+s.book : 'podcast::'+s.podcast+'::'+s.episode;
  }));
  document.getElementById('statSources').textContent = sources.size;
}
function renderAll(){ renderSidebar(); renderCards(); renderStats(); updateHeading(); }

/* ---------------- Auth & bookmarks (Supabase) ---------------- */
function renderAuthBox(){
  const box = document.getElementById('authBox');
  if (!sb){
    box.innerHTML = '';
    return;
  }
  if (currentUser){
    const meta = currentUser.user_metadata || {};
    const fullName = meta.full_name || meta.name || '';
    const firstName = fullName.split(' ')[0] || (currentUser.email ? currentUser.email.split('@')[0] : 'Account');
    const initial = (firstName[0] || 'P').toUpperCase();
    const avatarHtml = meta.avatar_url
      ? `<img src="${meta.avatar_url}" alt="" />`
      : `<span class="profile-initial">${escapeHtml(initial)}</span>`;

    box.innerHTML = `
      <div class="profile-menu">
        <button class="profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu for ${escapeHtml(firstName)}">
          ${avatarHtml}
        </button>
        <div class="profile-dropdown" id="profileDropdown" hidden>
          <div class="profile-dropdown-header">
            <div class="profile-avatar-lg">${avatarHtml}</div>
            <div>
              <div class="profile-name">${escapeHtml(firstName)}</div>
              <div class="profile-email">${escapeHtml(currentUser.email || '')}</div>
            </div>
          </div>
          <button class="profile-dropdown-item" id="signOutBtn">Sign out</button>
        </div>
      </div>
    `;

    const profileBtn = document.getElementById('profileBtn');
    const dropdown = document.getElementById('profileDropdown');
    const closeDropdown = () => { dropdown.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); };
    const openDropdown = () => { dropdown.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); };
    profileBtn.onclick = (e) => {
      e.stopPropagation();
      dropdown.hidden ? openDropdown() : closeDropdown();
    };
    document.addEventListener('click', (e) => {
      if (!dropdown.hidden && !e.target.closest('.profile-menu')) closeDropdown();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDropdown(); });
    document.getElementById('signOutBtn').onclick = async () => { await sb.auth.signOut(); };
  } else {
    box.innerHTML = `<button class="auth-btn" id="signInBtn">Sign in with Google</button>`;
    document.getElementById('signInBtn').onclick = async () => {
      await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
    };
  }
}

document.getElementById('gateSignInBtn')?.addEventListener('click', async () => {
  if (!sb) return;
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
});

async function loadBookmarks(){
  bookmarkedIds = new Set();
  if (!sb || !currentUser) return;
  const { data, error } = await sb.from('bookmarks').select('insight_id').eq('user_id', currentUser.id);
  if (error){
    console.error('Could not load bookmarks:', error.message);
    showToast('Could not load your bookmarks: ' + error.message, true);
    return;
  }
  bookmarkedIds = new Set((data || []).map(r => r.insight_id));
}

async function toggleBookmark(insightId){
  if (!sb) { showToast('Sign-in is not configured on this copy of the app.', true); return; }
  if (!currentUser){ document.getElementById('signInBtn')?.click(); return; }
  if (bookmarkedIds.has(insightId)){
    const { error } = await sb.from('bookmarks').delete().eq('user_id', currentUser.id).eq('insight_id', insightId);
    if (!error){ bookmarkedIds.delete(insightId); showToast('Bookmark removed'); }
    else { console.error('Bookmark delete failed:', error); showToast('Could not remove bookmark: ' + error.message, true); }
  } else {
    const { error } = await sb.from('bookmarks').insert({ user_id: currentUser.id, insight_id: insightId, created_at: new Date().toISOString() });
    if (!error){ bookmarkedIds.add(insightId); showToast('Bookmark saved'); }
    else { console.error('Bookmark insert failed:', error); showToast('Could not save bookmark: ' + error.message, true); }
  }
  renderAll();
}

if (sb){
  sb.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    showGate(!currentUser);
    renderAuthBox();
    await loadBookmarks();
    renderAll();
  });
}


const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

document.getElementById('themeToggle').onclick = () => {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const isLight = root.getAttribute('data-theme') === 'light';
  if (isLight){
    root.removeAttribute('data-theme');
    btn.innerHTML = MOON_ICON;
    btn.setAttribute('aria-label', 'Switch to light mode');
    btn.setAttribute('aria-pressed', 'false');
  } else {
    root.setAttribute('data-theme', 'light');
    btn.innerHTML = SUN_ICON;
    btn.setAttribute('aria-label', 'Switch to dark mode');
    btn.setAttribute('aria-pressed', 'true');
  }
};



renderAuthBox();
renderAll();

</script>
